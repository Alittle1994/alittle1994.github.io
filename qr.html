<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金田三中 — 安全隐患扫码填报</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f4f8;
    overflow: hidden;
  }

  /* Tech grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Floating tech orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 {
    width: 320px; height: 320px;
    background: rgba(37,99,235,0.08);
    top: -100px; right: -80px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 260px; height: 260px;
    background: rgba(6,182,212,0.06);
    bottom: -80px; left: -60px;
    animation-delay: -6s;
  }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-30px) scale(1.05); }
    66% { transform: translate(-20px,20px) scale(0.95); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    background: #fff;
    border-radius: 20px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.03),
      0 12px 32px rgba(0,0,0,0.06),
      0 0 0 1px rgba(0,0,0,0.04);
    padding: 44px 36px 36px;
    text-align: center;
    overflow: hidden;
  }

  /* Top tech accent bar */
  .card::before {
    content: '';
    display: block;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #2563eb, #06b6d4, #3b82f6);
    position: absolute;
    top: 0; left: 0;
  }

  /* Corner tech dots */
  .card::after {
    content: '';
    position: absolute;
    top: 20px; right: 20px;
    width: 60px; height: 60px;
    background:
      radial-gradient(circle at 30% 30%, rgba(37,99,235,0.06) 1px, transparent 1px),
      radial-gradient(circle at 70% 70%, rgba(6,182,212,0.06) 1px, transparent 1px),
      radial-gradient(circle at 50% 50%, rgba(59,130,246,0.04) 2px, transparent 2px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  /* Icon — modern shield */
  .icon-wrap {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .icon-wrap svg {
    width: 28px; height: 28px;
    fill: none;
    stroke: #2563eb;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* School name */
  .school {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 12px;
    color: #64748b;
    letter-spacing: 2px;
    font-weight: 500;
    margin-bottom: 28px;
  }

  /* Divider */
  .divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
    margin: 0 auto 28px;
  }

  /* QR wrapper */
  .qr-wrapper {
    display: inline-block;
    padding: 16px;
    background: #fff;
    border-radius: 14px;
    border: 2px solid #e2e8f0;
    position: relative;
    box-shadow: 0 0 0 6px rgba(37,99,235,0.03);
    transition: box-shadow 0.3s;
  }

  /* Scan corner marks */
  .qr-wrapper::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 18px;
    pointer-events: none;
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), #2563eb calc(50% - 1px), #2563eb calc(50% + 1px), transparent calc(50% + 1px)) 0 0 / 12px 12px no-repeat,
      linear-gradient(225deg, transparent calc(50% - 1px), #2563eb calc(50% - 1px), #2563eb calc(50% + 1px), transparent calc(50% + 1px)) 100% 0 / 12px 12px no-repeat,
      linear-gradient(315deg, transparent calc(50% - 1px), #2563eb calc(50% - 1px), #2563eb calc(50% + 1px), transparent calc(50% + 1px)) 100% 100% / 12px 12px no-repeat,
      linear-gradient(45deg, transparent calc(50% - 1px), #2563eb calc(50% - 1px), #2563eb calc(50% + 1px), transparent calc(50% + 1px)) 0 100% / 12px 12px no-repeat;
    opacity: 0.25;
    animation: cornerPulse 3s ease-in-out infinite;
  }
  @keyframes cornerPulse {
    0%,100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }

  .qr-wrapper canvas,
  .qr-wrapper img {
    display: block;
    border-radius: 4px;
  }

  /* WeChat hint */
  .wx-hint {
    margin-top: 18px;
    font-size: 13px;
    font-weight: 600;
    color: #2563eb;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .wx-hint.show { opacity: 1; }

  /* Responsive */
  @media (max-width: 480px) {
    .card {
      margin: 12px;
      padding: 36px 20px 28px;
      border-radius: 16px;
    }
    .school { font-size: 16px; }
    #qrcode canvas { width: 180px !important; height: 180px !important; }
    .card::after { display: none; }
  }

  @media print {
    body { background: #fff; }
    body::before, .orb { display: none; }
    .card {
      box-shadow: none;
      border: 1px solid #e5e7eb;
    }
    .qr-wrapper { box-shadow: none; }
    .qr-wrapper::before { display: none; }
    .card::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .icon-wrap { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24">
      <path d="M12 2l8 4v6c0 5.5-3.8 10.7-8 12-4.2-1.3-8-6.5-8-12V6l8-4z"/>
      <line x1="12" y1="8" x2="12" y2="13"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>

  <div class="school">桂平市金田镇第三初级中学</div>
  <div class="tagline">安全隐患排查 · 扫码填报</div>

  <div class="divider"></div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <div class="wx-hint" id="wxHint">长按识别二维码</div>
</div>

<script>
(function(){
  new QRCode(document.getElementById("qrcode"), {
    text: "https://alittle1994.github.io",
    width: 210,
    height: 210,
    colorDark: "#1e293b",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  var isWechat = /micromessenger/i.test(navigator.userAgent);
  if (isWechat) {
    document.getElementById('wxHint').classList.add('show');
  }
})();
</script>
</body>
</html>
