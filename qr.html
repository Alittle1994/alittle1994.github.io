<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金田三中 — 安全隐患扫码填报</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>
<style>
  :root {
    --dark: #0f172a;
    --accent: #c0392b;
    --gold: #b8860b;
    --silver: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    overflow: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(192,57,43,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(26,82,118,0.10) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(184,134,11,0.06) 0%, transparent 50%);
    animation: drift 20s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0); }
    33% { transform: translate(1%,-1%); }
    66% { transform: translate(-1%,1%); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: 20px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 48px 32px 36px;
    text-align: center;
  }

  /* Top accent line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 3px;
    background: linear-gradient(90deg, #c0392b, #b8860b);
    border-radius: 0 0 3px 3px;
  }

  /* Shield */
  .shield {
    width: 48px; height: 56px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    clip-path: polygon(50% 0%, 100% 12%, 100% 50%, 80% 90%, 50% 78%, 20% 90%, 0% 50%, 0% 12%);
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 4px 16px rgba(192,57,43,0.3));
  }
  .shield .inner {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    margin-top: -4px;
  }

  /* School name */
  .school {
    font-size: 18px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 12px;
    color: var(--silver);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  /* QR container */
  .qr-wrapper {
    display: inline-block;
    padding: 20px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 40px rgba(0,0,0,0.3);
    position: relative;
  }
  .qr-wrapper canvas,
  .qr-wrapper img {
    display: block;
    border-radius: 4px;
  }

  /* Scan pulse ring */
  .qr-wrapper::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 20px;
    border: 2px solid rgba(192,57,43,0.3);
    animation: scanPulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes scanPulse {
    0%,100% { border-color: rgba(192,57,43,0.15); transform: scale(1); }
    50% { border-color: rgba(192,57,43,0.45); transform: scale(1.02); }
  }

  /* WeChat hint — only shown in WeChat */
  .wx-hint {
    margin-top: 20px;
    font-size: 13px;
    color: #b8860b;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .wx-hint.show {
    opacity: 1;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .card {
      margin: 12px;
      padding: 36px 20px 28px;
      border-radius: 20px;
    }
    .school { font-size: 16px; }
    #qrcode canvas { width: 180px !important; height: 180px !important; }
  }

  @media print {
    body { background: #fff; }
    body::before { display: none; }
    .card {
      background: #fff;
      backdrop-filter: none;
      border-color: #ddd;
      box-shadow: none;
    }
    .school, .tagline { color: #222; }
    .tagline { color: #666; }
    .qr-wrapper { box-shadow: 0 0 0 1px #eee; }
    .qr-wrapper::after { display: none; }
    .card::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="shield"><span class="inner">!</span></div>
  <div class="school">桂平市金田镇第三初级中学</div>
  <div class="tagline">安全隐患扫码填报</div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <div class="wx-hint" id="wxHint">长按识别二维码</div>
</div>

<script>
(function(){
  new QRCode(document.getElementById("qrcode"), {
    text: "https://alittle1994.github.io",
    width: 220,
    height: 220,
    colorDark: "#0f172a",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  var isWechat = /micromessenger/i.test(navigator.userAgent);
  if (isWechat) {
    document.getElementById('wxHint').classList.add('show');
  }
})();
</script>
</body>
</html>
